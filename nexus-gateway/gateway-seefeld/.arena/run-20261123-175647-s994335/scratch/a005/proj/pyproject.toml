[project]
name = "jerumednexus-gateway"
version = "1.3.0"
description = "JerumedNexus Gateway: laboratory analyzers to HL7 v2.5 for PIS/LIS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jerumed Nexus GmbH", email = "info@jerumed-nexus.ch" }]
license = { text = "MIT" }

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = [".venv", "build", "deploy", "logs", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "E501",     # line too long -- handled by formatter
    "PLR0913",  # too many arguments -- deliberate in HL7 builder
    "PLR2004",  # magic numbers -- HL7 field indexes
    "PLR0912",  # too many branches -- protocol parsers
    "PLR0915",  # too many statements
    "SIM108",   # ternary preferred -- readability sometimes wins
    "B008",     # function-call default -- Flask patterns
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B011", "PLR0913", "ASYNC240"]
"config/settings.py" = ["UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
exclude = ["tests/", "\\.venv/", "build/", "deploy/"]

# Strict-mode islands: critical modules that MUST typecheck cleanly.
[[tool.mypy.overrides]]
module = ["src.hl7.*", "src.adapters.*", "src.security.*", "src.common.errors", "src.common.idempotency"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_reexport = true

[tool.bandit]
skips = ["B101", "B404", "B603", "B607"]   # asserts + subprocess used deliberately
exclude_dirs = ["tests", ".venv", "build"]
