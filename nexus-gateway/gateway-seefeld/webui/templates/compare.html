{% extends "base.html" %}
{% block title %}Compare Samples — Frame Inspector{% endblock %}
{% block content %}
<style>
  .cmp-search { display: flex; gap: 8px; margin: 16px 0; }
  .cmp-search input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; }
  .cmp-search button { padding: 8px 16px; background: var(--primary,#0891b2); color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  .cmp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
  .cmp-card { background: var(--surface,#f8fafc); border: 1px solid var(--border,#e2e8f0); border-radius: 8px; padding: 16px; }
  .cmp-card h3 { margin: 0 0 8px; font-family: monospace; }
  .cmp-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
  .cmp-table th, .cmp-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border,#eee); font-size: 0.9rem; }
  .cmp-table th { background: var(--surface-alt,#f6f7fa); font-size: 0.78rem; color: var(--muted,#666); text-transform: uppercase; }
  .cmp-table tr.diff { background: #fffbeb; }
  .cmp-table td.only-a { color: #dc2626; font-weight: 600; }
  .cmp-table td.only-b { color: #16a34a; font-weight: 600; }
  .cmp-warnings { background: #fef3c7; border-left: 4px solid #d97706; padding: 10px 14px; border-radius: 4px; margin: 8px 0; font-size: 0.85rem; }
</style>

<h1>Compare Samples</h1>
<p style="color:var(--muted,#666);">Confronta due sample side-by-side per identificare divergenze nei valori.</p>

<div class="cmp-search">
  <input id="sid-a" type="text" placeholder="Sample A (es. SN0042)">
  <input id="sid-b" type="text" placeholder="Sample B (es. SN0043)">
  <button onclick="doCompare()">Confronta</button>
</div>

<div id="result" style="display:none;"></div>

<script>
async function doCompare() {
  const a = document.getElementById('sid-a').value.trim();
  const b = document.getElementById('sid-b').value.trim();
  if (!a || !b) { alert('Servono entrambi i sample ID'); return; }
  const el = document.getElementById('result');
  el.style.display = 'block';
  el.innerHTML = 'Confronto in corso…';
  const r = await fetch(`/api/sample/${encodeURIComponent(a)}/compare/${encodeURIComponent(b)}`);
  const d = await r.json();
  if (!d.ok) { el.innerHTML = '<div style="color:#dc2626;">Errore: ' + (d.error||'') + '</div>'; return; }
  let html = `<div class="cmp-grid">
    <div class="cmp-card">
      <h3>A: ${d.sample_a.sample_id}</h3>
      <div style="font-size:0.85rem;color:var(--muted);">${d.sample_a.device} · ${d.sample_a.ts||''}</div>
    </div>
    <div class="cmp-card">
      <h3>B: ${d.sample_b.sample_id}</h3>
      <div style="font-size:0.85rem;color:var(--muted);">${d.sample_b.device} · ${d.sample_b.ts||''}</div>
    </div>
  </div>`;
  if (d.warnings_a.length || d.warnings_b.length) {
    html += '<div class="cmp-warnings"><b>Warnings A:</b> ' + (d.warnings_a.join(', ') || '—') + '<br><b>Warnings B:</b> ' + (d.warnings_b.join(', ') || '—') + '</div>';
  }
  html += '<table class="cmp-table"><thead><tr><th>Analita</th><th>A</th><th>B</th><th>Note</th></tr></thead><tbody>';
  for (const row of d.diff) {
    const cls = row.changed || row.only_in ? 'diff' : '';
    const ca = row.only_in === 'b' ? 'only-a' : '';
    const cb = row.only_in === 'a' ? 'only-b' : '';
    let note = '';
    if (row.only_in === 'a') note = 'solo in A';
    else if (row.only_in === 'b') note = 'solo in B';
    else if (row.changed) note = '⚠ diff';
    html += `<tr class="${cls}"><td><b>${row.analyte}</b></td><td class="${ca}">${row.value_a ?? '—'}</td><td class="${cb}">${row.value_b ?? '—'}</td><td>${note}</td></tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}
</script>
{% endblock %}
