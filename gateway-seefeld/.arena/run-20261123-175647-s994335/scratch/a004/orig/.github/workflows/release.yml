name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y dh-python dh-virtualenv debhelper debsigs
          pip install cyclonedx-bom==4.4.3 bandit[toml] pip-audit==2.7.3

      - name: Run tests
        run: pytest tests/ -q --tb=line

      - name: Generate SBOM
        run: |
          mkdir -p dist
          cyclonedx-py requirements -i requirements.txt \
              -o dist/sbom-${{ github.ref_name }}.cdx.json

      - name: Build .deb
        run: dh_virtualenv --python /usr/bin/python3.11

      - name: Sign .deb
        env:
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          DEB=$(ls ../jerumednexus-gateway_*.deb | head -1)
          debsigs --sign=origin --default-key="$SIGNING_KEY_ID" "$DEB"
          debsigs --verify "$DEB"
          mv "$DEB" dist/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }} \
              -f deploy/Dockerfile .
          docker tag ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }} \
              ghcr.io/${{ github.repository_owner }}/gateway:latest

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image with cosign
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }}
          cosign attest --yes --predicate dist/sbom-${{ github.ref_name }}.cdx.json \
              --type cyclonedx \
              ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }}

      - name: Push Docker
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/gateway:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository_owner }}/gateway:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/jerumednexus-gateway_*.deb
            dist/sbom-*.cdx.json
          generate_release_notes: true
          draft: false
