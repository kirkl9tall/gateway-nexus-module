---
# JerumedNexus Gateway — full-site provisioning
#
# Usage:
#   ansible-playbook -i inventory.ini deploy/ansible/site.yml
#
# Requirements:
#   - Ubuntu 22.04 or Raspberry Pi OS Bookworm on the target
#   - SSH key on the target with sudo NOPASSWD
#   - ansible >= 2.15
#
# Everything is idempotent — re-running is safe.

- name: Provision JerumedNexus Gateway
  hosts: gateways
  become: true
  vars:
    gateway_version: "1.3.0"
    apt_repo: "https://apt.jerumednexus.example"
    apt_key_url: "{{ apt_repo }}/gpg"
    dlq_key_source: "/etc/ansible/secrets/{{ inventory_hostname }}_dlq_key"
    gpg_backup_recipient: "backup@clinic.example"
    nas_mount: "/mnt/nas"

  pre_tasks:
    - name: Ensure prerequisites installed
      apt:
        name: [ca-certificates, curl, gnupg, git, python3-venv, python3-pip]
        state: present
        update_cache: true

  roles:
    - role: apt_repo
    - role: user
    - role: gateway_install
    - role: firewall
    - role: systemd_hardening
    - role: backup_cron
    - role: monitoring

  handlers:
    - name: Restart gateway
      systemd:
        name: jerumednexus-gateway
        state: restarted
        daemon_reload: true
