name: E2E Smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: End-to-end smoke (Debian 12 container)
    runs-on: ubuntu-latest
    container:
      image: debian:12
    steps:
      - uses: actions/checkout@v4

      - name: Install runtime deps as .deb would
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              python3 python3-pip python3-venv python3-dev \
              build-essential libffi-dev libssl-dev \
              ca-certificates curl adduser

      - name: Create jerumednexus user (like postinst does)
        run: |
          adduser --system --home /opt/jerumednexus --shell /usr/sbin/nologin \
                  --group --disabled-password jerumednexus || true
          mkdir -p /opt/jerumednexus
          cp -r . /opt/jerumednexus/
          chown -R jerumednexus:jerumednexus /opt/jerumednexus

      - name: Provision venv + install deps
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus python3 -m venv .venv
          sudo -u jerumednexus .venv/bin/pip install --upgrade pip --quiet
          sudo -u jerumednexus .venv/bin/pip install -r requirements.txt --quiet

      - name: Seed a config
        run: |
          cd /opt/jerumednexus
          cp config/gateway.yaml.example config/gateway.yaml
          sed -i "s|PRAXIS_NAME|CI_TEST|g" config/gateway.yaml
          chown jerumednexus:jerumednexus config/gateway.yaml

      - name: main.py --test-parse (sanity)
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus .venv/bin/python main.py --test-parse

      - name: main.py --check (should warn but exit non-fatal since no targets)
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus .venv/bin/python main.py --check || true

      - name: Reset-password CLI (idempotent, no files to remove)
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus .venv/bin/python main.py --reset-password

      - name: Import all modules (catch import errors early)
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus .venv/bin/python -c "
          import sys; sys.path.insert(0, '.')
          from src.gateway import Gateway
          from src.http_server import Loc200HttpServer
          from src.transport.dispatcher import Dispatcher
          from src.discovery.service import DiscoveryService
          from webui.app import app
          routes = [r.rule for r in app.url_map.iter_rules()]
          assert len(routes) > 20, f'too few routes: {len(routes)}'
          print(f'OK: {len(routes)} Flask routes')
          "

      - name: Boot the Web UI in background and curl /login
        run: |
          cd /opt/jerumednexus
          sudo -u jerumednexus .venv/bin/python -m flask --app webui.app run \
              --host=127.0.0.1 --port=8080 --no-debug &
          FLASK_PID=$!
          sleep 3
          curl -f -s http://127.0.0.1:8080/login | head -3
          curl -f -s http://127.0.0.1:8080/setup | head -3
          curl -f -s -X POST http://127.0.0.1:8080/api/users \
              && echo "ERROR: unauthenticated write should have failed" && exit 1 || true
          kill $FLASK_PID
