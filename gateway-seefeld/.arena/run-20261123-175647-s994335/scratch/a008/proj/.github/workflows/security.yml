name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'   # weekly, Monday 03:17 CET

jobs:
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install "bandit[toml]==1.7.9"
      - run: bandit -c pyproject.toml -r src -q -f sarif -o bandit.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: bandit.sarif}

  semgrep:
    runs-on: ubuntu-latest
    container: {image: returntocorp/semgrep}
    steps:
      - uses: actions/checkout@v4
      - run: semgrep --config auto --sarif --output semgrep.sarif || true
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: semgrep.sarif}

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install pip-audit==2.7.3
          pip-audit -r requirements.txt --strict --format json --output pip-audit.json || true
      - uses: actions/upload-artifact@v4
        with: {name: pip-audit, path: pip-audit.json}

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t jerumednexus:ci -f deploy/Dockerfile .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: jerumednexus:ci
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'      # report only during rollout, tighten later
      - uses: github/codeql-action/upload-sarif@v3
        with: {sarif_file: trivy.sarif}

  sbom-cyclonedx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          pip install cyclonedx-bom==4.4.3
          cyclonedx-py requirements -i requirements.txt -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: sbom, path: sbom.cdx.json}

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
