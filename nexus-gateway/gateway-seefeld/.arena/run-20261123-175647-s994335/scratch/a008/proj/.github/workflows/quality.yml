name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term \
                 --cov-fail-under=80 tests/
      - name: Adapter coverage floor 95%
        run: |
          coverage report --include='src/adapters/*' --fail-under=95
      - uses: codecov/codecov-action@v4
        with: {files: coverage.xml}

  mypy-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-dev.txt mypy==1.11.1
      - run: mypy --config-file pyproject.toml src/hl7 src/adapters src/security

  mutation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements-dev.txt mutmut==2.5.0
      - name: Mutation testing (parsers only)
        run: |
          mutmut run --paths-to-mutate src/hl7,src/adapters --runner "pytest -x" || true
          mutmut results > mutation_report.txt
      - name: Enforce mutation score >= 70%
        run: python tools/check_mutation_score.py mutation_report.txt 70
      - uses: actions/upload-artifact@v4
        with: {name: mutation-report, path: mutation_report.txt}

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install ruff==0.5.5
      - run: ruff check src/
      - run: ruff format --check src/
